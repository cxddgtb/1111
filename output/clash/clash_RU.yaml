proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 RU
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - RU_VLESS_443_712
  - RU_VLESS_443_1019
  - RU_VLESS_8443_522
  - RU_VLESS_443_594
  - RU_VLESS_443_611
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - RU_VLESS_8443_522
  - RU_VLESS_443_594
  - RU_VLESS_443_611
  - RU_VLESS_443_712
  - RU_VLESS_443_1019
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 RU
  type: url-test
  proxies:
  - RU_VLESS_443_712
  - RU_VLESS_443_1019
  - RU_VLESS_8443_522
  - RU_VLESS_443_594
  - RU_VLESS_443_611
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT
