  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - RU_VLESS_443_1438
  - RU_VLESS_2200_539
  - RU_VLESS_443_827
  - RU_VLESS_2053_753
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - RU_VLESS_2200_539
  - RU_VLESS_2053_753
  - RU_VLESS_443_827
  - RU_VLESS_443_1438
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 RU
  type: url-test
  proxies:
  - RU_VLESS_443_1438
  - RU_VLESS_2200_539
  - RU_VLESS_443_827
  - RU_VLESS_2053_753
