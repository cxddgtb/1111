proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 RU
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - RU_VLESS_443_958
  - RU_VLESS_443_433
  - RU_VLESS_2200_445
  - RU_VLESS_4100_438
  - RU_VLESS_4100_492
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - RU_VLESS_443_433
  - RU_VLESS_4100_438
  - RU_VLESS_2200_445
  - RU_VLESS_4100_492
  - RU_VLESS_443_958
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 RU
  type: url-test
  proxies:
  - RU_VLESS_443_958
  - RU_VLESS_443_433
  - RU_VLESS_2200_445
  - RU_VLESS_4100_438
  - RU_VLESS_4100_492
