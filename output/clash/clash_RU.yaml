  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 RU
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - RU_VLESS_443_786
  - RU_VLESS_443_894
  - RU_VLESS_443_601
  - RU_VLESS_8443_497
  - RU_SS_18443_668
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - RU_VLESS_8443_497
  - RU_VLESS_443_601
  - RU_SS_18443_668
  - RU_VLESS_443_786
  - RU_VLESS_443_894
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 RU
  type: url-test
  proxies:
  - RU_VLESS_443_786
  - RU_VLESS_443_894
  - RU_VLESS_443_601
  - RU_VLESS_8443_497
  - RU_SS_18443_668
