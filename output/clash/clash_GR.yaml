port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: GR_VLESS_443_655
  type: vless
  network: ws
  server: 85.90.197.159
  port: 443
  uuid: 99c5b713-dedf-4a10-8070-916ff3f49b0e
  servername: fs.qicai99.com
  tls: true
  ws-opts:
    headers:
      Host: fs.qicai99.com
    path: /fp=chrome
  country: GR
- name: GR_HTTP_443_653
  port: 443
  server: 149.22.85.65
  skip-cert-verify: true
  tls: true
  type: http
  udp: true
  x-toolall-mihomo: true
  country: GR
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 GR
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - GR_VLESS_443_655
  - GR_HTTP_443_653
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - GR_HTTP_443_653
  - GR_VLESS_443_655
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 GR
  type: url-test
  proxies:
  - GR_VLESS_443_655
  - GR_HTTP_443_653
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,googlevideo.com,📺 YouTube 优选
- DOMAIN-SUFFIX,youtube.com,📺 YouTube 优选
- DOMAIN-SUFFIX,ytimg.com,📺 YouTube 优选
- DOMAIN-SUFFIX,yt.be,📺 YouTube 优选
- DOMAIN-SUFFIX,ggpht.com,📺 YouTube 优选
- MATCH,🚀 节点选择
