proxies:
- client-fingerprint: chrome
  encryption: none
  name: AU_VLESS_443_403
  network: ws
  port: '443'
  server: 202.166.187.132
  servername: f.yoptybla.ru
  tls: true
  type: vless
  udp: true
  uuid: 8be20011-59b1-4118-91ed-83e8e6b662cd
  ws-opts:
    headers:
      Host: f.yoptybla.ru
      User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/35.0.1916.153 Safari/537.36
