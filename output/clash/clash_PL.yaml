  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 PL
  type: url-test
  proxies:
  - PL_VLESS_80_403
  - PL_HTTP_443_612
  - PL_VLESS_443_1043
  - PL_VLESS_443_457
  - PL_VLESS_443_482
