  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - PL_VLESS_443_338
  - PL_VLESS_443_345
  - PL_VLESS_443_353
  - PL_VLESS_443_353_2
  - PL_HTTP_443_445
  - PL_VLESS_443_464
  - PL_HTTP_443_494
  url: http://www.gstatic.com/generate_204
  interval: 300
