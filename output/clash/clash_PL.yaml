  type: url-test
  proxies: &id001
  - PL_VLESS_443_464
  - PL_VLESS_443_345
  - PL_VLESS_443_353
  - PL_VLESS_443_338
  - PL_HTTP_443_494
  - PL_VLESS_443_353_2
