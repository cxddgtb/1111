  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - PL_VLESS_80_403
  - PL_VLESS_443_457
  - PL_VLESS_443_482
  - PL_HTTP_443_612
  - PL_VLESS_443_1043
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
