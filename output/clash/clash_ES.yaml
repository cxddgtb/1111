proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 ES
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - ES_HTTP_443_613
  - ES_HTTP_443_665
  - ES_HTTP_443_617
  - ES_VLESS_443_621
  - ES_VMESS_22324_361
  - ES_VMESS_22324_327
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - ES_VMESS_22324_327
  - ES_VMESS_22324_361
  - ES_HTTP_443_613
  - ES_HTTP_443_617
  - ES_VLESS_443_621
  - ES_HTTP_443_665
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 ES
  type: url-test
  proxies:
  - ES_HTTP_443_613
  - ES_HTTP_443_665
  - ES_HTTP_443_617
  - ES_VLESS_443_621
  - ES_VMESS_22324_361
  - ES_VMESS_22324_327
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
