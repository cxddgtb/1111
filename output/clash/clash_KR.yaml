port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: KR_VMESS_443_333
  type: vmess
  network: tcp
  server: 140.238.2.250
  port: 443
  uuid: 41a7089a-040b-4538-8b8d-010902405bde
  skip-cert-verify: true
  alterId: 0
  cipher: auto
