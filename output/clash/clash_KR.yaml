proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 KR
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
