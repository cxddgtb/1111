  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 CL
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - CL_VLESS_80_359
  - CL_VLESS_80_370
  - CL_VLESS_80_365
  - CL_VLESS_80_366
  - CL_VLESS_80_368
