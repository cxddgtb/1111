  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - CZ_VLESS_443_799
  - CZ_VLESS_443_1149
  - CZ_VLESS_443_2231
  - CZ_HTTP_9443_637
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - CZ_HTTP_9443_637
  - CZ_VLESS_443_799
  - CZ_VLESS_443_1149
  - CZ_VLESS_443_2231
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 CZ
  type: url-test
  proxies:
  - CZ_VLESS_443_799
  - CZ_VLESS_443_1149
  - CZ_VLESS_443_2231
  - CZ_HTTP_9443_637
  url: http://www.gstatic.com/generate_204
