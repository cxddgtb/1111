  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - NL_VMESS_1234_379
  - NL_VLESS_443_585
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 NL
  type: url-test
  proxies:
  - NL_VLESS_443_585
  - NL_VMESS_1234_379
  url: http://www.gstatic.com/generate_204
