proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 NL
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - NL_VLESS_443_585
  - NL_VMESS_1234_379
  url: http://www.gstatic.com/generate_204
