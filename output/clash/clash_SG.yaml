proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 SG
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - SG_VLESS_2096_658
  - SG_VMESS_18000_340
  - SG_VMESS_18000_333
  - SG_VLESS_2083_69
  - SG_HTTP_2080_490
  - SG_HTTP_2080_491
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - SG_VLESS_2083_69
  - SG_VMESS_18000_333
  - SG_VMESS_18000_340
  - SG_HTTP_2080_490
  - SG_HTTP_2080_491
  - SG_VLESS_2096_658
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 SG
  type: url-test
  proxies:
  - SG_VLESS_2096_658
  - SG_VMESS_18000_340
  - SG_VMESS_18000_333
  - SG_VLESS_2083_69
  - SG_HTTP_2080_490
  - SG_HTTP_2080_491
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
