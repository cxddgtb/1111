proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 SE
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - SE_VLESS_443_938
  - SE_VLESS_12345_840
  - SE_VLESS_443_825
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - SE_VLESS_443_825
  - SE_VLESS_12345_840
  - SE_VLESS_443_938
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 SE
  type: url-test
  proxies:
  - SE_VLESS_443_938
  - SE_VLESS_12345_840
