proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 SC
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - SC_VLESS_443_612
  - SC_TROJAN_443_272
  - SC_VLESS_443_577
  - SC_VLESS_443_522
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - SC_TROJAN_443_272
  - SC_VLESS_443_522
  - SC_VLESS_443_577
  - SC_VLESS_443_612
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 SC
  type: url-test
  proxies:
  - SC_VLESS_443_612
  - SC_TROJAN_443_272
  - SC_VLESS_443_577
  - SC_VLESS_443_522
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,googlevideo.com,📺 YouTube 优选
- DOMAIN-SUFFIX,youtube.com,📺 YouTube 优选
- DOMAIN-SUFFIX,ytimg.com,📺 YouTube 优选
- DOMAIN-SUFFIX,yt.be,📺 YouTube 优选
- DOMAIN-SUFFIX,ggpht.com,📺 YouTube 优选
- MATCH,🚀 节点选择
