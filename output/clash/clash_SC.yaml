- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 SC
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - SC_VLESS_443_635
  - SC_VLESS_443_707
  - SC_VLESS_2083_66
  - SC_VLESS_443_1094
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - SC_VLESS_2083_66
  - SC_VLESS_443_635
  - SC_VLESS_443_707
  - SC_VLESS_443_1094
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 SC
  type: url-test
  proxies:
  - SC_VLESS_443_635
  - SC_VLESS_443_707
  - SC_VLESS_2083_66
  - SC_VLESS_443_1094
