port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: FI_VLESS_443_155
  network: ws
  port: 443
  server: fi1.zuoai.cf
  servername: xi.tbv.ccwu.cc
  tls: true
  type: vless
  uuid: b2593749-691c-428c-9481-14979cba3446
  ws-opts:
    headers:
      Host: xi.tbv.ccwu.cc
    path: /proxyip=us.xiabibi.cf
  country: FI
- name: FI_VLESS_9097_354
  server: 65.109.205.148
  port: 9097
  type: vless
  uuid: Channel:telegram:TurboConfigs
  tls: false
  network: http
  http-opts:
    method: GET
    path:
    - /
