proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 CY
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - CY_VLESS_443_596
  - CY_VLESS_2087_863
  - CY_VLESS_14430_580
  - CY_HTTP_443_584
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - CY_VLESS_14430_580
  - CY_HTTP_443_584
  - CY_VLESS_443_596
  - CY_VLESS_2087_863
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 CY
  type: url-test
  proxies:
  - CY_VLESS_443_596
  - CY_VLESS_2087_863
  - CY_VLESS_14430_580
  - CY_HTTP_443_584
  url: http://www.gstatic.com/generate_204
