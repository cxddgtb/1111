proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 PH
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - PH_VLESS_80_751
  - PH_VLESS_80_740
  - PH_VLESS_80_758
  - PH_VLESS_80_733
  - PH_VLESS_80_735
  - PH_VLESS_80_746
