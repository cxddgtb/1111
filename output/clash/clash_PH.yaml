  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - PH_VLESS_80_733
  - PH_VLESS_80_735
  - PH_VLESS_80_735_2
  - PH_VLESS_80_740
  - PH_VLESS_80_746
  - PH_VLESS_80_751
  - PH_VLESS_80_758
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
