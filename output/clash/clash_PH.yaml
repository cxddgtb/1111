  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 PH
  type: url-test
  proxies:
  - PH_VLESS_80_751
  - PH_VLESS_80_740
  - PH_VLESS_80_758
  - PH_VLESS_80_733
  - PH_VLESS_80_735
