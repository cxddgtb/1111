  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - JP_SS_8388_296
  - JP_VLESS_443_416
  - JP_VLESS_443_508
  - JP_SS_443_640
  - JP_VLESS_2053_760
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
