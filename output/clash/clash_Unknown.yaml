proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 Unknown
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - Unknown_VMESS_443_130
  - Unknown_VMESS_443_211
  - Unknown_VMESS_443_229
  - Unknown_VLESS_2052_54
  - Unknown_VMESS_443_98
  - Unknown_HTTP_443_35
