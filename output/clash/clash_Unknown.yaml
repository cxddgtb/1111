  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 Unknown
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - Unknown_VLESS_443_358
  - Unknown_VLESS_443_755
  - Unknown_VMESS_443_453
  - Unknown_VLESS_2083_70
  - Unknown_VLESS_2087_70
  - Unknown_VLESS_443_619
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - Unknown_VLESS_2083_70
  - Unknown_VLESS_2087_70
  - Unknown_VLESS_443_358
  - Unknown_VMESS_443_453
  - Unknown_VLESS_443_619
  - Unknown_VLESS_443_755
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
