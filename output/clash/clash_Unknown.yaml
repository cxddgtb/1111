  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - Unknown_HTTP_443_35
  - Unknown_VLESS_2052_54
  - Unknown_VMESS_443_98
  - Unknown_VMESS_443_130
  - Unknown_VMESS_443_211
  - Unknown_VMESS_443_229
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
