  proxies:
  - EE_VLESS_443_385
  - EE_VLESS_443_468
  - EE_VLESS_443_475
  - EE_VLESS_443_609
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
