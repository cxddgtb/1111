proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 GB
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - GB_HTTP_443_410
  - GB_HTTP_443_445
  - GB_HTTP_443_434
  - GB_HTTP_443_415
  - GB_HTTP_443_469
  - GB_HTTP_443_434_2
  - GB_HTTP_9443_456
  - GB_HTTP_443_435
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - GB_HTTP_443_410
  - GB_HTTP_443_415
  - GB_HTTP_443_434
  - GB_HTTP_443_434_2
  - GB_HTTP_443_435
  - GB_HTTP_443_445
  - GB_HTTP_9443_456
  - GB_HTTP_443_469
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 GB
  type: url-test
  proxies:
  - GB_HTTP_443_410
  - GB_HTTP_443_445
  - GB_HTTP_443_434
  - GB_HTTP_443_415
  - GB_HTTP_443_469
  - GB_HTTP_443_434_2
  - GB_HTTP_9443_456
  - GB_HTTP_443_435
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,googlevideo.com,📺 YouTube 优选
- DOMAIN-SUFFIX,youtube.com,📺 YouTube 优选
- DOMAIN-SUFFIX,ytimg.com,📺 YouTube 优选
- DOMAIN-SUFFIX,yt.be,📺 YouTube 优选
