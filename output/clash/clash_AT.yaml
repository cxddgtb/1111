port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: AT_HTTP_443_687
  port: 443
  server: 146.70.244.18
  skip-cert-verify: true
  tls: true
  type: http
  country: AT
- name: AT_TROJAN_443_480
  server: 212.183.88.136
  port: 443
  type: trojan
  password: humanity
  sni: www.calmlunch.com
  skip-cert-verify: true
  network: ws
  ws-opts:
    path: /assignment
    headers:
      Host: www.calmlunch.com
  udp: true
  country: AT
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 AT
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - AT_HTTP_443_687
  - AT_TROJAN_443_480
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - AT_TROJAN_443_480
  - AT_HTTP_443_687
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 AT
  type: url-test
  proxies:
  - AT_HTTP_443_687
  - AT_TROJAN_443_480
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
rules:
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,youtube.com)),REJECT
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,googlevideo.com,📺 YouTube 优选
- DOMAIN-SUFFIX,youtube.com,📺 YouTube 优选
- DOMAIN-SUFFIX,ytimg.com,📺 YouTube 优选
- DOMAIN-SUFFIX,yt.be,📺 YouTube 优选
- DOMAIN-SUFFIX,ggpht.com,📺 YouTube 优选
- MATCH,🚀 节点选择
