  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - CN_VMESS_10086_827
  - CN_VMESS_11244_831
  - CN_VMESS_11267_1250
  - CN_VMESS_50002_2712
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 CN
  type: url-test
  proxies:
  - CN_VMESS_11244_831
  - CN_VMESS_10086_827
  - CN_VMESS_11267_1250
  - CN_VMESS_50002_2712
