  - FR_VLESS_443_450
  - FR_VMESS_1234_488
  - FR_VMESS_1234_488_2
  - FR_VLESS_443_610
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
