  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 FR
  type: url-test
  proxies:
  - FR_VMESS_1234_488
  - FR_VMESS_1234_488_2
