  interval: 300
  tolerance: 100
- name: 📺 YouTube 优选
  type: url-test
  proxies: *id001
  url: https://www.youtube.com
  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - DE_VMESS_22324_293
  - DE_VMESS_110_311
  - DE_VLESS_80_455
  - DE_HTTP_443_592
  - DE_HTTP_443_598
  - DE_VLESS_443_647
