proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ⚡ 全球最低延迟
  - ♻️ 自动故障转移
  - ⚖️ 负载均衡
  - 📺 YouTube 优选
  - 🌍 DE
  - DIRECT
- name: ⚡ 全球最低延迟
  type: url-test
  proxies: &id001
  - DE_VLESS_80_455
  - DE_VLESS_443_771
  - DE_VLESS_443_647
  - DE_VMESS_110_311
  - DE_VMESS_22324_293
  - DE_VLESS_2096_658
  - DE_VLESS_443_690
  - DE_HTTP_443_598
  - DE_HTTP_443_592
  - DE_HTTP_443_682
