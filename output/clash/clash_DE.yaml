- name: ⚖️ 负载均衡
  type: load-balance
  strategy: consistent-hashing
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🌍 DE
  type: url-test
  proxies:
  - DE_VLESS_80_455
  - DE_VLESS_443_771
  - DE_VLESS_443_647
  - DE_VMESS_110_311
  - DE_VMESS_22324_293
