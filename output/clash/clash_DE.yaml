  interval: 300
  tolerance: 50
- name: ♻️ 自动故障转移
  type: fallback
  proxies:
  - DE_HTTP_11111_291
  - DE_VLESS_80_297
  - DE_VLESS_80_302
  - DE_HTTP_443_364
  - DE_HTTP_443_366
  - DE_HTTP_443_374
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: ⚖️ 负载均衡
