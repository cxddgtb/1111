name: Daily Node Crawl and Test

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 运行 (北京时间 08:00)
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml geoip2

      - name: Download Mihomo (Clash Meta Core)
        run: |
          cat << 'EOF' > download_mihomo.py
          import urllib.request, json, gzip, shutil, os, sys
          
          # 动态获取最新的 Mihomo 版本下载链接
          req = urllib.request.Request('https://api.github.com/repos/MetaCubeX/mihomo/releases/latest', headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  assets = data.get('assets', [])
                  
                  # 优先寻找最新的兼容版 amd64 .gz 文件
                  url = next((a['browser_download_url'] for a in assets if 'linux-amd64-compatible' in a['name'] and a['name'].endswith('.gz')), None)
                  if not url:
                      # 如果找不到，降级寻找任何 amd64 .gz 文件
                      url = next((a['browser_download_url'] for a in assets if 'linux-amd64' in a['name'] and a['name'].endswith('.gz')), None)
                      
                  if url:
                      print(f'Downloading latest mihomo: {url}')
                      urllib.request.urlretrieve(url, 'mihomo.gz')
                      
                      # 自动解压并赋予执行权限
                      with gzip.open('mihomo.gz', 'rb') as f_in:
                          with open('mihomo', 'wb') as f_out:
                              shutil.copyfileobj(f_in, f_out)
                      os.remove('mihomo.gz')
                      os.chmod('mihomo', 0o755)
                      print('Mihomo downloaded and extracted successfully.')
                  else:
                      print('No suitable mihomo release found.')
                      sys.exit(1)
          except Exception as e:
              print(f'Error downloading mihomo: {e}')
              sys.exit(1)
          EOF
          
          python download_mihomo.py
          mv mihomo src/

      - name: Download GeoLite2 Database
        run: |
          mkdir -p src
          # 下载离线 GeoIP 数据库，包含 -f 参数防止 404 时生成空文件
          curl -fsSL https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb -o src/GeoLite2-Country.mmdb

      - name: Run Scraper and Tester
        run: python src/main.py

      - name: Commit and Push Output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          # 只有当 output 文件夹有变化时才提交，避免空提交报错
          git diff --staged --quiet || git commit -m "Auto update nodes [skip ci]"
          git push
